name: Build on release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update package.json
        run: npm version ${{ github.ref_name }} --git-tag-version false

      - name: Build
        run: npm run build

      # The card loads the other files on demand. Upload them first, so a
      # release is never visible with the card but without its files.
      - name: Hide the card file during the first upload
        run: mkdir main && mv dist/plotly-graph-card.js main/

      - name: Upload the on-demand files
        uses: svenstaro/upload-release-action@v2
        with:
          file: dist/*.js
          file_glob: true

      - name: Upload the card file
        uses: svenstaro/upload-release-action@v2
        with:
          file: main/plotly-graph-card.js
