name: Plotly compatibility

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run tsc
      - run: bun run lint
      - run: bun run build
      - name: Unit tests
        run: bun run test
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
      - run: bun run test:autorange
      - run: bun run test:resize
      - run: bun run test:card-lifecycle
      - run: bun run test:loading
      - run: bun run test:touch
      - run: bun run test:split
