name: YAML editor

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - "src/**"
      - "yaml-editor/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".github/workflows/yaml-editor.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: yaml-editor
      - run: bun run tsc
      - run: bun run lint:yaml-editor
      - run: bun run test
        working-directory: yaml-editor
      - run: bun run build
        working-directory: yaml-editor
      - run: git diff --exit-code -- yaml-editor/src/schema.json
